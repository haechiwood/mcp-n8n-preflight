# Publishes to PyPI with Trusted Publishing (no API token stored anywhere).
# One-time setup on pypi.org: add a trusted publisher for this repo, workflow "publish.yml",
# environment "pypi". Then create a GitHub release to publish.
name: publish
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[test]" && pytest -q
      - run: pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
