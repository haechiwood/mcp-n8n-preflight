[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "mcp-n8n-preflight"
version = "0.1.1"
description = "MCP server that checks exported n8n workflow JSON for failure patterns, leaked secrets and template readiness"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["mcp", "model-context-protocol", "n8n", "lint", "workflow", "claude"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "mcp>=2.3.0,<3",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
mcp-n8n-preflight = "n8n_preflight.server:main"
n8n-preflight = "n8n_preflight.cli:main"

[project.urls]
Repository = "https://github.com/haechiwood/mcp-n8n-preflight"

[tool.hatch.build.targets.wheel]
packages = ["src/n8n_preflight"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "server.json", "pyproject.toml"]
